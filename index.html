<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mayura Games</title>
<meta name="description" content="Mayura Games, makers of Cluewise.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1A26;--card:#10283A;--ink:#EAF2F5;--muted:#9FB3BF;--gold:#F2C75C;--line:#21435A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header .mark{width:44px;height:44px;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:#3A2604;font-weight:900;font-size:22px}
header .name{font-weight:900;font-size:18px}
header .by{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px}
h1{font-size:28px;line-height:1.2;margin:0 0 4px}
.meta{color:var(--gold);font-weight:700;font-size:14px;margin:0 0 18px}
h2{font-size:19px;margin:26px 0 6px;color:var(--gold)}
p{margin:0 0 12px}
ul{margin:0 0 12px;padding-left:22px}
li{margin:4px 0}
a{color:var(--gold)}
nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
nav a{display:inline-block;padding:10px 16px;border-radius:12px;background:var(--gold);color:#3A2604;font-weight:800;text-decoration:none}
footer{color:var(--muted);font-size:13px;margin-top:22px;text-align:center}
</style>
</head>
<body><main>
<header><div class="mark">C</div><div><div class="name">Cluewise: Word Puzzle Game</div><div class="by">by Mayura Games</div></div></header>
<div class="card"><h1>Mayura Games</h1><p class="meta">Games made with care</p>
<p><b>Cluewise: Word Puzzle Game</b>: read the category, think about the clue, find the word.</p>
<nav><a href="cluewise/">Cluewise</a><a href="cluewise/privacy.html">Privacy Policy</a><a href="cluewise/terms.html">Terms of Service</a></nav></div>
<footer>© 2026 Mayura Games · <a href="mailto:cluewisesupport@gmail.com">cluewisesupport@gmail.com</a></footer>
</main></body>
</html>
